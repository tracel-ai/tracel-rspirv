[workspace]
members = ["autogen", "rspirv", "xtask", "pliron-spirv"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.91"
version = "0.17.0+sdk-1.4.363.0"

[workspace.lints.clippy]
# Temporary workaround for linting generated code:
# https://github.com/rust-lang/rust-clippy/issues/17525
redundant_field_names = "allow"

[workspace.dependencies]
log = { default-features = false, version = "0.4.22" }
# pliron = { git = "https://github.com/pliron-org/pliron.git", rev = "0abdb154de39cd4b8d892c1dda3d6e2da615a8d3", default-features = false }
pliron = { version = "0.20", default-features = false }
# pliron = { path = "../pliron", default-features = false }
rstest = "0.26.1"
strum = { version = "0.28", features = ["derive"] }
tracel-xtask = { version = "=5.0.0" }

[profile.dev]
debug = 0
