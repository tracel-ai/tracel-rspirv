on: [push, pull_request]

name: Continuous integration

jobs:
  autogen:
    name: Run autogen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: run
          args: -p rspirv-autogen
          toolchain: nightly
      - name: Diff autogen result
        run: git diff --quiet || (echo "::error::Generated files are different, please regenerate with cargo run -p rspirv-autogen!"; git diff; false)
  fmt:
    name: Cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          profile: minimal
          components: rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check
          toolchain: nightly
  clippy:
    name: Cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal
          components: clippy
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --workspace --all-features --all-targets -- -Dwarnings
  test:
    name: Cargo check and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, nightly]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          override: true
          profile: minimal
      # The pliron-spirv tests validate their output with spirv-val when it is installed.
      - name: Install SPIRV-Tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y spirv-tools
      - name: Install SPIRV-Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install spirv-tools
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --workspace --all-features --all-targets --verbose
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --workspace --all-features --verbose
